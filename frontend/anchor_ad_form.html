
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anchor Ad Form</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6">
  <div class="w-full max-w-2xl bg-white p-6 rounded-lg shadow">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Your Anchor Ad Details</h2>
    <form id="adForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Name</label>
        <input type="text" id="nameInput" class="mt-1 block w-full border border-gray-300 rounded-md p-2" value="John Doe">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Photo</label>
        <input type="file" id="photoInput" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Phone</label>
        <input type="text" id="phoneInput" class="mt-1 block w-full border border-gray-300 rounded-md p-2" value="9876543210">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Address</label>
        <input type="text" id="addressInput" class="mt-1 block w-full border border-gray-300 rounded-md p-2" value="123 Main Street, City">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Service Description</label>
        <textarea id="descriptionInput" class="mt-1 block w-full border border-gray-300 rounded-md p-2" rows="3">Expert plumbing services with 10+ years of experience.</textarea>
      </div>
      <div class="text-right">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md font-medium hover:bg-blue-700">Submit</button>
      </div>
    </form>
  </div>

  <!-- Anchor Ad Live Preview -->
  <div class="w-full max-w-2xl bg-gray-100 p-4 mt-8 rounded-lg shadow-md">
    <h3 class="text-lg font-semibold text-gray-700 mb-2">Live Anchor Ad Preview</h3>
    <div class="bg-white p-4 rounded border border-gray-300 flex items-center space-x-4">
      <div>
        <img id="previewPhoto" src="https://via.placeholder.com/80" alt="Ad Photo" class="w-20 h-20 rounded-full object-cover">
      </div>
      <div>
        <p class="text-lg font-bold text-gray-800" id="previewName">John Doe</p>
        <p class="text-sm text-gray-600" id="previewPhone">9876543210</p>
        <p class="text-sm text-gray-600" id="previewAddress">123 Main Street, City</p>
        <p class="text-sm text-gray-600 italic mt-1" id="previewDescription">Expert plumbing services with 10+ years of experience.</p>
      </div>
    </div>
  </div>

  <script>
    const nameInput = document.getElementById('nameInput');
    const phoneInput = document.getElementById('phoneInput');
    const addressInput = document.getElementById('addressInput');
    const descriptionInput = document.getElementById('descriptionInput');
    const photoInput = document.getElementById('photoInput');

    const previewName = document.getElementById('previewName');
    const previewPhone = document.getElementById('previewPhone');
    const previewAddress = document.getElementById('previewAddress');
    const previewDescription = document.getElementById('previewDescription');
    const previewPhoto = document.getElementById('previewPhoto');

    nameInput.addEventListener('input', () => previewName.textContent = nameInput.value);
    phoneInput.addEventListener('input', () => previewPhone.textContent = phoneInput.value);
    addressInput.addEventListener('input', () => previewAddress.textContent = addressInput.value);
    descriptionInput.addEventListener('input', () => previewDescription.textContent = descriptionInput.value);

    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => previewPhoto.src = e.target.result;
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
