<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px; /* Add some padding for smaller screens */
            box-sizing: border-box;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px; /* Increased max-width for better form layout */
            overflow-y: auto; /* Allow scrolling within the container if content overflows */
            max-height: 95vh; /* Limit container height to allow body scroll */
            box-sizing: border-box;
        }

        h2 {
            color: #6a5acd;
            text-align: center;
            margin-bottom: 30px; /* Increased margin */
            font-size: 2.25rem; /* text-3xl */
            font-weight: 700; /* bold */
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        input[type="text"], input[type="file"], input[type="password"], select, input[type="time"], textarea { /* Added textarea */
            width: 100%;
            padding: 12px; /* Increased padding */
            border: 1px solid #cbd5e0; /* border-gray-300 */
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 16px; /* Increased margin */
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, input[type="file"]:focus, input[type="password"]:focus, select:focus, input[type="time"]:focus, textarea:focus {
            outline: none;
            border-color: #6a5acd;
            box-shadow: 0 0 0 3px rgba(106, 92, 205, 0.2);
        }

        small {
            display: block;
            margin-top: -10px; /* Adjusted to be closer to input */
            margin-bottom: 16px; /* Aligned with input margin */
            color: #888;
            font-size: 0.85rem;
        }

        button {
            width: 100%;
            background-color: #6a5acd;
            color: white;
            border: none;
            padding: 14px; /* Increased padding */
            border-radius: 8px;
            font-size: 1.1rem; /* Slightly larger font */
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px; /* Increased margin */
            transition: background-color 0.2s, transform 0.2s;
        }

        button:hover {
            background-color: #5947c0;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .row {
            display: flex;
            gap: 20px; /* Increased gap */
            margin-bottom: 16px;
        }

        .row > div {
            flex: 1;
        }

        @media (max-width: 640px) {
            .row {
                flex-direction: column;
                gap: 0; /* Remove gap in column layout */
            }
        }

        .location-details {
            background-color: #f0f4f8; /* Lighter blue-gray background */
            border: 1px solid #d1d9e6; /* Lighter border */
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            margin-bottom: 16px;
            display: none;
            color: #4a5568; /* Darker text for readability */
        }

        .location-details p {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        /* Style for required asterisk */
        label span {
            color: red;
            margin-left: 4px;
        }

        .error-message {
            color: #ef4444; /* Red-500 */
            font-size: 0.875rem; /* text-sm */
            margin-top: -12px; /* Pull it closer to the input above */
            margin-bottom: 12px;
            display: none; /* Hidden by default */
        }
        .error-message.visible {
            display: block;
        }
        
        #messageBox {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 1000;
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Complete Your Profile</h2>

        <form id="profileForm">
            <label for="formType">Form is Self or By Agent <span>*</span></label>
            <select id="formType" onchange="toggleAgentIdField()" class="mb-4">
                <option value="">Select</option>
                <option value="self">Self</option>
                <option value="agent">By Agent</option>
            </select>
            <div id="agentIdField" style="display: none;">
                <label for="agentId">Enter Agent ID <span>*</span></label>
                <input type="text" id="agentId" placeholder="Agent ID">
                <div id="agentId-error" class="error-message"></div>
            </div>

            <label for="userType">Register as <span>*</span></label>
            <select id="userType" onchange="updateFormFields()" class="mb-4">
                <option value="">Select</option>
                <option value="service">Service</option>
                <option value="business">Business</option>
            </select>
            <div id="userType-error" class="error-message"></div>

            <label>First Name <span>*</span></label>
            <input type="text" id="firstName">
            <div id="firstName-error" class="error-message"></div>

            <label>Last Name <span>*</span></label>
            <input type="text" id="lastName">
            <div id="lastName-error" class="error-message"></div>

            <label>Gender <span>*</span></label>
            <select id="gender" class="mb-4">
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <div id="gender-error" class="error-message"></div>

            <label id="nameLabel">Service/Business Name <span>*</span></label>
            <input type="text" id="serviceBusinessName">
            <div id="serviceBusinessName-error" class="error-message"></div>

            <!-- Phone Number (already verified on login-signup page) - Display only -->
            <label for="displayPhoneNumber">Primary Contact (Verified Phone Number)</label>
            <input type="text" id="displayPhoneNumber" disabled class="bg-gray-100 cursor-not-allowed">
            <small>This phone number was verified during signup/login and cannot be changed here.</small>
            
            <label for="email">Email ID</label>
            <input type="text" id="email" placeholder="Optional">
            <div id="email-error" class="error-message"></div>
            <small>Optional</small>

            <label id="categoryLabel">Service 1 <span>*</span></label>
            <input type="text" id="service1">
            <div id="service1-error" class="error-message"></div>

            <label>Service 2</label>
            <input type="text" id="service2">
            <small>Optional</small>

            <label for="state">State <span>*</span></label>
            <select id="state" onchange="populateCities()" class="mb-4">
                <option value="">Select State</option>
            </select>
            <div id="state-error" class="error-message"></div>

            <label for="city">City <span>*</span></label>
            <select id="city" onchange="getLocationDetails()" class="mb-4">
                <option value="">Select City</option>
            </select>
            <div id="city-error" class="error-message"></div>

            <div id="locationDetails" class="location-details"></div>

            <label for="fullAddress">Full Address <span>*</span></label>
            <input type="text" id="fullAddress" placeholder="e.g., Mudiyan Wali Gali, Shivpuri Taal, Jhansi">
            <div id="fullAddress-error" class="error-message"></div>

            <label for="pincode">PIN Code <span>*</span></label>
            <input type="text" id="pincode" placeholder="e.g., 284001">
            <div id="pincode-error" class="error-message"></div>

            <div class="row">
                <div>
                    <label id="serviceBusinessMobileLabel">Service/Business Mobile Number <span>*</span></label>
                    <input type="text" id="serviceBusinessMobileNumber">
                    <div id="serviceBusinessMobileNumber-error" class="error-message"></div>
                </div>
                <div>
                    <label>WhatsApp Number <span>*</span></label>
                    <input type="text" id="whatsappNumber">
                    <div id="whatsappNumber-error" class="error-message"></div>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Open Time <span>*</span></label>
                    <input type="time" id="openTime">
                    <div id="openTime-error" class="error-message"></div>
                </div>
                <div>
                    <label>Close Time <span>*</span></label>
                    <input type="time" id="closeTime">
                    <div id="closeTime-error" class="error-message"></div>
                </div>
            </div>

            <label>Description <span>*</span></label>
            <textarea id="description" rows="4" placeholder="Provide a brief description of your service/business..."></textarea>
            <div id="description-error" class="error-message"></div>

            <label for="locationUrl">Google Maps Location URL</label>
            <input type="text" id="locationUrl" placeholder="Optional">
            <small>Optional</small>
            <div id="locationUrl-error" class="error-message"></div>

            <label for="instagramUrl">Instagram Profile URL</label>
            <input type="text" id="instagramUrl" placeholder="Optional">
            <small>Optional</small>
            <div id="instagramUrl-error" class="error-message"></div>

            <label for="youtubeUrl">YouTube Channel URL</label>
            <input type="text" id="youtubeUrl" placeholder="Optional">
            <small>Optional</small>
            <div id="youtubeUrl-error" class="error-message"></div>

            <label for="password">Create Password <span>*</span></label>
            <input type="password" id="password">
            <div id="password-error" class="error-message"></div>

            <label for="confirmPassword">Re-enter Password <span>*</span></label>
            <input type="password" id="confirmPassword">
            <div id="confirmPassword-error" class="error-message"></div>

            <div id="uploadLabel">
                <label for="uploadFile">Upload Photo/Logo <span>*</span></label>
                <input type="file" id="uploadFile" accept="image/*">
                <div id="uploadFile-error" class="error-message"></div>
            </div>

            <div id="deliveryField">
                <label>Home Delivery <span>*</span></label>
                <select id="homeDelivery" class="mb-4">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
                <div id="homeDelivery-error" class="error-message"></div>
            </div>

            <label style="display: flex; align-items: center; margin-top: 20px; font-weight: normal; color: #555;">
                <input type="checkbox" id="termsCheckbox" required style="width: auto; margin-right: 8px; margin-bottom: 0;"> I have read all the details successfully and agree to the <a href="#" target="_blank" style="color: #6a5acd; text-decoration: underline; margin-left: 4px;">terms and policy</a>.
            </label>
            <div id="termsCheckbox-error" class="error-message"></div>

            <button type="submit" id="submitProfileBtn">Submit Profile & Proceed to Payment</button>
        </form>
    </div>

    <!-- Message box -->
    <div id="messageBox"></div>

    <!-- Firebase SDK imports -->
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, EmailAuthProvider, linkWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // Firebase Initialization (from global context)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        let app;
        let auth;
        let db;
        let storage; // Firebase Storage
        let userId = null;
        let userPhoneNumber = null; // To store the phone number passed from login page

        // DOM elements
        const profileForm = document.getElementById('profileForm');
        const submitProfileBtn = document.getElementById('submitProfileBtn');
        const displayPhoneNumberInput = document.getElementById('displayPhoneNumber');
        const userTypeSelect = document.getElementById('userType');
        const formTypeSelect = document.getElementById('formType');
        const agentIdField = document.getElementById('agentIdField');
        const agentIdInput = document.getElementById('agentId');
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const genderSelect = document.getElementById('gender');
        const serviceBusinessNameInput = document.getElementById('serviceBusinessName');
        const emailInput = document.getElementById('email');
        const service1Input = document.getElementById('service1');
        const service2Input = document.getElementById('service2');
        const stateSelect = document.getElementById('state');
        const citySelect = document.getElementById('city');
        const locationDetailsDiv = document.getElementById('locationDetails');
        const fullAddressInput = document.getElementById('fullAddress');
        const pincodeInput = document.getElementById('pincode');
        const serviceBusinessMobileNumberInput = document.getElementById('serviceBusinessMobileNumber'); // Renamed/New
        const whatsappNumberInput = document.getElementById('whatsappNumber');
        const openTimeInput = document.getElementById('openTime');
        const closeTimeInput = document.getElementById('closeTime');
        const descriptionInput = document.getElementById('description');
        const locationUrlInput = document.getElementById('locationUrl');
        const instagramUrlInput = document.getElementById('instagramUrl');
        const youtubeUrlInput = document.getElementById('youtubeUrl');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const uploadFileInput = document.getElementById('uploadFile');
        const homeDeliverySelect = document.getElementById('homeDelivery');
        const deliveryField = document.getElementById('deliveryField');
        const termsCheckbox = document.getElementById('termsCheckbox');
        const serviceBusinessMobileLabel = document.getElementById('serviceBusinessMobileLabel'); // New label

        const messageBox = document.getElementById('messageBox');

        let allLocationsData = []; // Store fetched locations for dropdowns

        // Error message elements (created dynamically in HTML, access here by ID)
        const errorElements = {
            formType: document.getElementById('formType-error'),
            agentId: document.getElementById('agentId-error'),
            userType: document.getElementById('userType-error'),
            firstName: document.getElementById('firstName-error'),
            lastName: document.getElementById('lastName-error'),
            gender: document.getElementById('gender-error'),
            serviceBusinessName: document.getElementById('serviceBusinessName-error'),
            email: document.getElementById('email-error'),
            service1: document.getElementById('service1-error'),
            state: document.getElementById('state-error'),
            city: document.getElementById('city-error'),
            fullAddress: document.getElementById('fullAddress-error'),
            pincode: document.getElementById('pincode-error'),
            serviceBusinessMobileNumber: document.getElementById('serviceBusinessMobileNumber-error'), // Renamed
            whatsappNumber: document.getElementById('whatsappNumber-error'),
            openTime: document.getElementById('openTime-error'),
            closeTime: document.getElementById('closeTime-error'),
            description: document.getElementById('description-error'),
            locationUrl: document.getElementById('locationUrl-error'),
            instagramUrl: document.getElementById('instagramUrl-error'),
            youtubeUrl: document.getElementById('youtubeUrl-error'),
            password: document.getElementById('password-error'),
            confirmPassword: document.getElementById('confirmPassword-error'),
            uploadFile: document.getElementById('uploadFile-error'),
            homeDelivery: document.getElementById('homeDelivery-error'),
            termsCheckbox: document.getElementById('termsCheckbox-error')
        };

        // Message display function
        function showMessage(message, duration = 3000, type = 'info') {
            messageBox.textContent = message;
            messageBox.style.backgroundColor = type === 'error' ? 'rgba(255, 0, 0, 0.8)' : (type === 'success' ? 'rgba(0, 128, 0, 0.8)' : 'rgba(0, 0, 0, 0.8)');
            messageBox.style.display = 'block';
            if (duration > 0) {
                setTimeout(() => {
                    messageBox.style.display = 'none';
                }, duration);
            }
        }

        // Helper to generate a consistent pseudo-email from a phone number
        function getPseudoEmailFromPhoneNumber(phoneNumber) {
            const cleanedPhoneNumber = phoneNumber.replace(/[^0-9]/g, '');
            return `${cleanedPhoneNumber}@phone.yourapp.com`; // IMPORTANT: Use a consistent domain
        }

        /**
         * Initializes Firebase application and authenticates the user.
         */
        async function initializeFirebaseAndAuth() {
            try {
                if (!app) {
                    app = initializeApp(firebaseConfig);
                }
                if (!auth) {
                    auth = getAuth(app);
                }
                if (!db) {
                    db = getFirestore(app);
                }
                if (!storage) {
                    storage = getStorage(app); // Initialize Firebase Storage
                }

                // Get userId from URL parameter first
                const urlParams = new URLSearchParams(window.location.search);
                const uidFromUrl = urlParams.get('userId');
                
                if (uidFromUrl) {
                    userId = uidFromUrl;
                    console.log("Profile Form: User ID from URL:", userId);
                    // Check if current user is the one from URL, if not, sign in with custom token
                    if (!auth.currentUser || auth.currentUser.uid !== userId) {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                            console.log("Firebase signed in with custom token for URL user.");
                        } else {
                            await signInAnonymously(auth);
                            console.log("Firebase signed in anonymously as no token provided.");
                            // If anonymous, ensure userId matches, or redirect/error
                            if (auth.currentUser.uid !== userId) {
                                console.error("Anonymous user mismatch with URL userId. Redirecting to login.");
                                showMessage("Authentication mismatch. Please log in again.", 5000, 'error');
                                setTimeout(() => window.location.href = 'login-signup-page.html', 3000);
                                return;
                            }
                        }
                    }
                    userPhoneNumber = auth.currentUser.phoneNumber; // Get phone number from authenticated user
                    displayPhoneNumberInput.value = userPhoneNumber || 'N/A';

                } else if (auth.currentUser) { // If no UID in URL, use current auth user
                    userId = auth.currentUser.uid;
                    userPhoneNumber = auth.currentUser.phoneNumber;
                    displayPhoneNumberInput.value = userPhoneNumber || 'N/A';
                    console.log("Profile Form: User ID from current auth:", userId);
                } else { // No UID and no current user, need to authenticate
                     if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                        console.log("Firebase signed in with custom token.");
                    } else {
                        await signInAnonymously(auth);
                        console.log("Firebase signed in anonymously.");
                    }
                    userId = auth.currentUser?.uid || crypto.randomUUID();
                    userPhoneNumber = auth.currentUser?.phoneNumber;
                    displayPhoneNumberInput.value = userPhoneNumber || 'N/A';
                    console.log("Profile Form: Authenticated anonymously, User ID:", userId);

                    // If still no phone number, it means user wasn't phone-authenticated.
                    // This scenario should ideally not happen if they come from OTP verification.
                    // A proper flow would enforce redirection back to login.
                    if (!userPhoneNumber) {
                        console.warn("User authenticated without a phone number. Likely direct access to form.");
                        showMessage("Please verify your phone number first.", 5000, 'error');
                        setTimeout(() => window.location.href = 'login-signup-page.html', 3000);
                        return;
                    }
                }
                
                // Fetch existing profile data to pre-fill form if user is existing
                await loadUserProfile(userId);

            } catch (error) {
                console.error("Error initializing Firebase or authenticating:", error);
                showMessage(`Error during Firebase setup: ${error.message}`, 5000, 'error');
                throw error;
            }
        }

        /**
         * Loads existing user profile data from Firestore and pre-fills the form.
         * @param {string} uid The user's UID.
         */
        async function loadUserProfile(uid) {
            try {
                const profileDocRef = doc(db, `artifacts/${appId}/public/data/service_providers`, uid);
                const profileDocSnap = await getDoc(profileDocRef);

                if (profileDocSnap.exists()) {
                    const profileData = profileDocSnap.data();
                    console.log("Existing profile data loaded:", profileData);

                    // Pre-fill fields
                    formTypeSelect.value = profileData.formType || '';
                    toggleAgentIdField(); // Adjust agent ID field visibility
                    agentIdInput.value = profileData.agentId || '';

                    userTypeSelect.value = profileData.type || '';
                    updateFormFields(); // Adjust labels and delivery field
                    
                    firstNameInput.value = profileData.firstName || '';
                    lastNameInput.value = profileData.lastName || '';
                    genderSelect.value = profileData.gender || '';
                    serviceBusinessNameInput.value = profileData.name || '';
                    emailInput.value = profileData.email || '';
                    service1Input.value = profileData.service1 || '';
                    service2Input.value = profileData.service2 || '';
                    
                    // For locations, first populate states, then cities, then set values
                    if (profileData.state) {
                        stateSelect.value = profileData.state;
                        await populateCities(profileData.state); // Pass state to populate cities
                        if (profileData.city) {
                            citySelect.value = profileData.city;
                            getLocationDetails(); // Update location details for pre-filled city
                        }
                    }

                    fullAddressInput.value = profileData.fullAddress || '';
                    pincodeInput.value = profileData.pincode || '';
                    serviceBusinessMobileNumberInput.value = profileData.serviceBusinessMobileNumber || ''; // Pre-fill new field
                    whatsappNumberInput.value = profileData.whatsappNumber || '';
                    openTimeInput.value = profileData.openTime || '';
                    closeTimeInput.value = profileData.closeTime || '';
                    descriptionInput.value = profileData.description || '';
                    locationUrlInput.value = profileData.locationUrl || '';
                    instagramUrlInput.value = profileData.instagramUrl || '';
                    youtubeUrlInput.value = profileData.youtubeUrl || '';
                    homeDeliverySelect.value = profileData.homeDelivery || 'no'; // Default to 'no'
                    
                    // No need to pre-fill password fields for security reasons
                    // Users set/update password on submission

                    showMessage("Existing profile loaded. You can update your details.", 3000, 'info');
                } else {
                    console.log("No existing profile found for this user. Starting fresh form.");
                    showMessage("Welcome! Please complete your profile details.", 3000, 'info');
                }
            } catch (error) {
                console.error("Error loading user profile:", error);
                showMessage(`Error loading profile: ${error.message}`, 5000, 'error');
            }
        }


        // Validation Functions
        function clearErrors() {
            Object.values(errorElements).forEach(el => {
                if (el) {
                    el.textContent = '';
                    el.classList.remove('visible');
                }
            });
        }

        function validateField(inputElement, errorElement, message, condition) {
            if (condition) {
                errorElement.textContent = '';
                errorElement.classList.remove('visible');
                return true;
            } else {
                errorElement.textContent = message;
                errorElement.classList.add('visible');
                return false;
            }
        }

        function validatePhoneNumberInput(inputElement, errorElement) {
            const phoneNumber = inputElement.value.trim();
            // Allow optional '+' and 10-15 digits
            return validateField(inputElement, errorElement, "Please enter a valid phone number (e.g., +11234567890).", /^\+?[0-9]{10,15}$/.test(phoneNumber));
        }

        function validateEmailInput(inputElement, errorElement, optional = false) {
            const email = inputElement.value.trim();
            if (optional && email === '') {
                return true; // Optional field, empty is valid
            }
            // Basic email regex
            return validateField(inputElement, errorElement, "Please enter a valid email address.", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
        }

        function validateUrlInput(inputElement, errorElement, optional = false) {
            const url = inputElement.value.trim();
            if (optional && url === '') {
                return true; // Optional field, empty is valid
            }
            // Basic URL regex
            return validateField(inputElement, errorElement, "Please enter a valid URL.", /^(https?:\/\/(?:www\.|(?!www))[a-zA-Z0-9][a-zA-Z0-9-]+[a-zA-Z0-9]\.[^\s]{2,}|www\.[a-zA-Z0-9][a-zA-Z0-9-]+[a-zA-Z0-9]\.[^\s]{2,}|https?:\/\/(?:www\.|(?!www))[a-zA-Z0-9]+\.[^\s]{2,}|www\.[a-zA-Z0-9]+\.[^\s]{2,})$/i.test(url));
        }

        function validatePasswords() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            let isValid = true;

            isValid = validateField(passwordInput, errorElements.password, "Password must be at least 6 characters.", password.length >= 6) && isValid;
            isValid = validateField(confirmPasswordInput, errorElements.confirmPassword, "Please confirm your password.", confirmPassword.length > 0) && isValid;

            if (password !== confirmPassword) {
                errorElements.confirmPassword.textContent = "Passwords do not match.";
                errorElements.confirmPassword.classList.add('visible');
                isValid = false;
            }
            return isValid;
        }

        // Form Logic Functions
        function toggleAgentIdField() {
            const formType = formTypeSelect.value;
            if (formType === 'agent') {
                agentIdField.style.display = 'block';
            } else {
                agentIdField.style.display = 'none';
                agentIdInput.value = ''; // Clear the field if hidden
                errorElements.agentId.textContent = ''; // Clear error
                errorElements.agentId.classList.remove('visible');
            }
        }

        function updateFormFields() {
            const userType = userTypeSelect.value;
            const categoryLabel = document.getElementById('categoryLabel');
            const nameLabel = document.getElementById('nameLabel');
            const uploadLabel = document.getElementById('uploadLabel').querySelector('label');
            const serviceBusinessMobileLabel = document.getElementById('serviceBusinessMobileLabel');


            if (userType === 'service') {
                categoryLabel.innerHTML = 'Service 1 <span>*</span>';
                nameLabel.innerHTML = 'Service Name <span>*</span>';
                uploadLabel.innerHTML = 'Upload Photo <span>*</span>';
                serviceBusinessMobileLabel.innerHTML = 'Service Mobile Number <span>*</span>'; // Update label for service
                deliveryField.style.display = 'none';
                homeDeliverySelect.value = 'no'; // Default to no for services
                errorElements.homeDelivery.textContent = ''; // Clear error
                errorElements.homeDelivery.classList.remove('visible');

            } else if (userType === 'business') {
                categoryLabel.innerHTML = 'Business Category <span>*</span>';
                nameLabel.innerHTML = 'Business Name <span>*</span>';
                uploadLabel.innerHTML = 'Upload Logo <span>*</span>';
                serviceBusinessMobileLabel.innerHTML = 'Business Mobile Number <span>*</span>'; // Update label for business
                deliveryField.style.display = 'block';
            } else {
                // Default state if nothing is selected or an invalid option
                categoryLabel.innerHTML = 'Service 1 <span>*</span>'; // Default to service label
                nameLabel.innerHTML = 'Service/Business Name <span>*</span>';
                uploadLabel.innerHTML = 'Upload Photo/Logo <span>*</span>';
                serviceBusinessMobileLabel.innerHTML = 'Service/Business Mobile Number <span>*</span>'; // Generic label
                deliveryField.style.display = 'none';
                homeDeliverySelect.value = 'no';
                errorElements.homeDelivery.textContent = '';
                errorElements.homeDelivery.classList.remove('visible');
            }
        }

        // Location Dropdown Functions
        async function populateStates() {
            stateSelect.innerHTML = `<option value="">Loading States...</option>`;
            citySelect.innerHTML = `<option value="">Select City</option>`; // Reset city
            locationDetailsDiv.style.display = 'none'; // Hide location details

            try {
                // Fetch locations from Firestore (public collection)
                const colRef = collection(db, `artifacts/${appId}/public/data/locations`);
                const querySnapshot = await getDocs(colRef);
                allLocationsData = querySnapshot.docs.map(doc => doc.data());

                const uniqueStates = [...new Set(allLocationsData.map(loc => loc.State))].sort();
                
                stateSelect.innerHTML = `<option value="">Select State</option>`; // Reset to default
                uniqueStates.forEach(state => {
                    const option = document.createElement('option');
                    option.value = state;
                    option.textContent = state;
                    stateSelect.appendChild(option);
                });

                if (uniqueStates.length === 0) {
                    showMessage("No states found. Please upload locations via Admin Panel.", 5000, 'error');
                }
                console.log("States populated:", uniqueStates);

            } catch (error) {
                console.error("Error populating states:", error);
                showMessage(`Error loading states: ${error.message}`, 5000, 'error');
                stateSelect.innerHTML = `<option value="">Error loading states</option>`;
            }
        }

        function populateCities(selectedStateValue = null) {
            const state = selectedStateValue || stateSelect.value;
            citySelect.innerHTML = `<option value="">Select City</option>`; // Reset city
            locationDetailsDiv.style.display = 'none'; // Hide location details

            if (state) {
                const uniqueCities = [...new Set(allLocationsData
                    .filter(loc => loc.State === state)
                    .map(loc => loc.City)
                )].sort();

                uniqueCities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
                if (uniqueCities.length === 0) {
                    showMessage(`No cities found for ${state}.`, 3000, 'info');
                }
                console.log(`Cities for ${state} populated:`, uniqueCities);
            }
        }

        function getLocationDetails() {
            const selectedState = stateSelect.value;
            const selectedCity = citySelect.value;
            locationDetailsDiv.innerHTML = "";
            locationDetailsDiv.style.display = 'none';

            if (selectedState && selectedCity) {
                const matchingLocation = allLocationsData.find(loc => 
                    loc.State === selectedState && loc.City === selectedCity
                );

                if (matchingLocation) {
                    locationDetailsDiv.innerHTML = `
                        <p><strong>District:</strong> ${matchingLocation.District || 'N/A'}</p>
                        <p><strong>Nearby Locations:</strong> ${matchingLocation['Nearby Locations'] || 'N/A'}</p>
                        <p><strong>PIN Codes:</strong> ${matchingLocation['PIN Codes'] || 'N/A'}</p>
                    `;
                    locationDetailsDiv.style.display = 'block';
                }
            }
        }

        // Main form submission handler
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors(); // Clear previous errors

            submitProfileBtn.disabled = true;
            showMessage("Submitting profile...", 0, 'info'); // Persistent message

            let hasErrors = false;

            // --- Form Validation ---
            // Text Inputs
            if (!validateField(formTypeSelect, errorElements.formType, "Please select if form is self or by agent.", formTypeSelect.value !== "")) hasErrors = true;
            if (formTypeSelect.value === 'agent' && !validateField(agentIdInput, errorElements.agentId, "Agent ID is required.", agentIdInput.value.trim() !== "")) hasErrors = true;
            if (!validateField(userTypeSelect, errorElements.userType, "Please select if registering as Service or Business.", userTypeSelect.value !== "")) hasErrors = true;
            if (!validateField(firstNameInput, errorElements.firstName, "First Name is required.", firstNameInput.value.trim() !== "")) hasErrors = true;
            if (!validateField(lastNameInput, errorElements.lastName, "Last Name is required.", lastNameInput.value.trim() !== "")) hasErrors = true;
            if (!validateField(genderSelect, errorElements.gender, "Please select Gender.", genderSelect.value !== "")) hasErrors = true;
            if (!validateField(serviceBusinessNameInput, errorElements.serviceBusinessName, "Service/Business Name is required.", serviceBusinessNameInput.value.trim() !== "")) hasErrors = true;
            if (!validateEmailInput(emailInput, errorElements.email, true)) hasErrors = true; // Optional email
            if (!validateField(service1Input, errorElements.service1, "Service 1 / Business Category is required.", service1Input.value.trim() !== "")) hasErrors = true;
            if (!validateField(stateSelect, errorElements.state, "Please select a State.", stateSelect.value !== "")) hasErrors = true;
            if (!validateField(citySelect, errorElements.city, "Please select a City.", citySelect.value !== "")) hasErrors = true;
            if (!validateField(fullAddressInput, errorElements.fullAddress, "Full Address is required.", fullAddressInput.value.trim() !== "")) hasErrors = true;
            if (!validateField(pincodeInput, errorElements.pincode, "PIN Code is required and must be numeric.", /^\d{6}$/.test(pincodeInput.value.trim()))) hasErrors = true;
            if (!validatePhoneNumberInput(serviceBusinessMobileNumberInput, errorElements.serviceBusinessMobileNumber)) hasErrors = true; // Validate new field
            if (!validatePhoneNumberInput(whatsappNumberInput, errorElements.whatsappNumber)) hasErrors = true;
            if (!validateField(openTimeInput, errorElements.openTime, "Open Time is required.", openTimeInput.value.trim() !== "")) hasErrors = true;
            if (!validateField(closeTimeInput, errorElements.closeTime, "Close Time is required.", closeTimeInput.value.trim() !== "")) hasErrors = true;
            if (!validateField(descriptionInput, errorElements.description, "Description is required.", descriptionInput.value.trim() !== "")) hasErrors = true;
            if (!validateUrlInput(locationUrlInput, errorElements.locationUrl, true)) hasErrors = true; // Optional URL
            if (!validateUrlInput(instagramUrlInput, errorElements.instagramUrl, true)) hasErrors = true; // Optional URL
            if (!validateUrlInput(youtubeUrlInput, errorElements.youtubeUrl, true)) hasErrors = true; // Optional URL
            
            if (!validatePasswords()) hasErrors = true; // Password validation

            if (!validateField(uploadFileInput, errorElements.uploadFile, "Please upload a photo/logo.", uploadFileInput.files.length > 0)) hasErrors = true;
            
            if (userTypeSelect.value === 'business' && !validateField(homeDeliverySelect, errorElements.homeDelivery, "Please select Home Delivery option.", homeDeliverySelect.value !== "")) hasErrors = true;

            if (!validateField(termsCheckbox, errorElements.termsCheckbox, "You must agree to the terms and policy.", termsCheckbox.checked)) hasErrors = true;


            if (hasErrors) {
                showMessage("Please correct the errors in the form.", 4000, 'error');
                submitProfileBtn.disabled = false;
                // Scroll to the first error
                const firstError = document.querySelector('.error-message.visible');
                if (firstError) {
                    firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }

            // --- Data Collection ---
            const profileData = {
                formType: formTypeSelect.value,
                agentId: formTypeSelect.value === 'agent' ? agentIdInput.value.trim() : null,
                type: userTypeSelect.value, // 'service' or 'business'
                firstName: firstNameInput.value.trim(),
                lastName: lastNameInput.value.trim(),
                gender: genderSelect.value,
                name: serviceBusinessNameInput.value.trim(), // Service Name or Business Name
                primaryPhoneNumber: userPhoneNumber, // From Firebase Auth - this is the login/verified number
                serviceBusinessMobileNumber: serviceBusinessMobileNumberInput.value.trim(), // New field
                email: emailInput.value.trim() || null,
                service1: service1Input.value.trim(),
                service2: service2Input.value.trim() || null,
                state: stateSelect.value,
                city: citySelect.value,
                fullAddress: fullAddressInput.value.trim(),
                pincode: pincodeInput.value.trim(),
                whatsappNumber: whatsappNumberInput.value.trim(),
                openTime: openTimeInput.value,
                closeTime: closeTimeInput.value,
                description: descriptionInput.value.trim(),
                locationUrl: locationUrlInput.value.trim() || null,
                instagramUrl: instagramUrlInput.value.trim() || null,
                youtubeUrl: youtubeUrlInput.value.trim() || null,
                homeDelivery: userTypeSelect.value === 'business' ? homeDeliverySelect.value : null,
                status: 'pending', // Initial status for admin approval
                createdAt: new Date().toISOString(),
                lastUpdated: new Date().toISOString()
            };

            try {
                // 1. Upload Profile Picture/Logo to Firebase Storage
                const file = uploadFileInput.files[0];
                let fileUrl = null;
                if (file) {
                    const storageRef = ref(storage, `profile_pictures/${userId}/${file.name}`);
                    const uploadTask = await uploadBytes(storageRef, file);
                    fileUrl = await getDownloadURL(uploadTask.ref);
                    profileData.profilePictureUrl = fileUrl;
                    console.log("Profile picture uploaded:", fileUrl);
                }

                // 2. Link Password to Firebase User (using pseudo-email)
                const user = auth.currentUser;
                const password = passwordInput.value;
                const pseudoEmail = getPseudoEmailFromPhoneNumber(userPhoneNumber);

                // Check if the user already has an email provider linked
                const hasEmailProvider = user.providerData.some(provider => provider.providerId === EmailAuthProvider.PROVIDER_ID);

                if (!hasEmailProvider) {
                    // If no email provider, link with pseudo-email and password
                    const credential = EmailAuthProvider.credential(pseudoEmail, password);
                    await linkWithCredential(user, credential);
                    console.log("Firebase user linked with pseudo-email and password.");
                } else {
                    // If email provider exists (e.g., from previous password set), just update password
                    await updatePassword(user, password);
                    console.log("Firebase user password updated.");
                }

                // 3. Save Profile Data to Firestore
                const docRef = doc(db, `artifacts/${appId}/public/data/service_providers`, userId);
                await setDoc(docRef, profileData, { merge: true }); // Use merge to update existing fields or add new ones
                console.log("Profile data saved to Firestore:", profileData);

                showMessage("Profile submitted successfully! Redirecting to payment...", 3000, 'success');
                setTimeout(() => {
                    window.location.href = `payment.html?userId=${userId}`; // Redirect to payment page
                }, 2000);

            } catch (error) {
                console.error("Error submitting profile:", error);
                let errorMessage = `Failed to submit profile: ${error.message}`;
                if (error.code === 'auth/requires-recent-login') {
                    errorMessage = "Please re-authenticate recently to update password. Log out and log in again.";
                } else if (error.code === 'auth/email-already-in-use') {
                    errorMessage = "An account with this email (pseudo-email) already exists. This should not happen with pseudo-emails.";
                }
                showMessage(errorMessage, 8000, 'error');
            } finally {
                submitProfileBtn.disabled = false;
            }
        });


        // Initial setup on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await initializeFirebaseAndAuth();
                console.log("Profile Creation Form: Firebase initialized and authenticated.");
                await populateStates(); // Populate states when page loads

                // Update fields based on initial selections
                updateFormFields();
                toggleAgentIdField();
                
            } catch (error) {
                console.error("Profile Creation Form: Failed to initialize Firebase:", error);
                alert("Failed to connect to Firebase. Some features might not work. Please check the console for details.");
                // Disable form submission if Firebase init fails
                submitProfileBtn.disabled = true;
            }
        });

        // Event listeners for input validation (live feedback)
        firstNameInput.addEventListener('input', () => validateField(firstNameInput, errorElements.firstName, "First Name is required.", firstNameInput.value.trim() !== ""));
        lastNameInput.addEventListener('input', () => validateField(lastNameInput, errorElements.lastName, "Last Name is required.", lastNameInput.value.trim() !== ""));
        serviceBusinessNameInput.addEventListener('input', () => validateField(serviceBusinessNameInput, errorElements.serviceBusinessName, "Service/Business Name is required.", serviceBusinessNameInput.value.trim() !== ""));
        emailInput.addEventListener('input', () => validateEmailInput(emailInput, errorElements.email, true));
        service1Input.addEventListener('input', () => validateField(service1Input, errorElements.service1, "Service 1 / Business Category is required.", service1Input.value.trim() !== ""));
        fullAddressInput.addEventListener('input', () => validateField(fullAddressInput, errorElements.fullAddress, "Full Address is required.", fullAddressInput.value.trim() !== ""));
        pincodeInput.addEventListener('input', () => validateField(pincodeInput, errorElements.pincode, "PIN Code is required and must be 6 digits.", /^\d{6}$/.test(pincodeInput.value.trim())));
        serviceBusinessMobileNumberInput.addEventListener('input', () => validatePhoneNumberInput(serviceBusinessMobileNumberInput, errorElements.serviceBusinessMobileNumber)); // Updated
        whatsappNumberInput.addEventListener('input', () => validatePhoneNumberInput(whatsappNumberInput, errorElements.whatsappNumber));
        openTimeInput.addEventListener('input', () => validateField(openTimeInput, errorElements.openTime, "Open Time is required.", openTimeInput.value.trim() !== ""));
        closeTimeInput.addEventListener('input', () => validateField(closeTimeInput, errorElements.closeTime, "Close Time is required.", closeTimeInput.value.trim() !== ""));
        descriptionInput.addEventListener('input', () => validateField(descriptionInput, errorElements.description, "Description is required.", descriptionInput.value.trim() !== ""));
        locationUrlInput.addEventListener('input', () => validateUrlInput(locationUrlInput, errorElements.locationUrl, true));
        instagramUrlInput.addEventListener('input', () => validateUrlInput(instagramUrlInput, errorElements.instagramUrl, true));
        youtubeUrlInput.addEventListener('input', () => validateUrlInput(youtubeUrlInput, errorElements.youtubeUrl, true));
        passwordInput.addEventListener('input', validatePasswords);
        confirmPasswordInput.addEventListener('input', validatePasswords);
        termsCheckbox.addEventListener('change', () => validateField(termsCheckbox, errorElements.termsCheckbox, "You must agree to the terms and policy.", termsCheckbox.checked));
        
        // Specific listeners for select elements on change
        formTypeSelect.addEventListener('change', () => validateField(formTypeSelect, errorElements.formType, "Please select if form is self or by agent.", formTypeSelect.value !== ""));
        userTypeSelect.addEventListener('change', () => {
            validateField(userTypeSelect, errorElements.userType, "Please select if registering as Service or Business.", userTypeSelect.value !== "");
            updateFormFields(); // Call to update labels
        });
        genderSelect.addEventListener('change', () => validateField(genderSelect, errorElements.gender, "Please select Gender.", genderSelect.value !== ""));
        stateSelect.addEventListener('change', () => validateField(stateSelect, errorElements.state, "Please select a State.", stateSelect.value !== ""));
        citySelect.addEventListener('change', () => validateField(citySelect, errorElements.city, "Please select a City.", citySelect.value !== ""));
        uploadFileInput.addEventListener('change', () => validateField(uploadFileInput, errorElements.uploadFile, "Please upload a photo/logo.", uploadFileInput.files.length > 0));
        homeDeliverySelect.addEventListener('change', () => {
            if (userTypeSelect.value === 'business') {
                validateField(homeDeliverySelect, errorElements.homeDelivery, "Please select Home Delivery option.", homeDeliverySelect.value !== "");
            }
        });
    </script>
</body>

</html>
