<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proceed to Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Enhanced background gradient */
            background: linear-gradient(135deg, #e0f7fa, #bbdefb, #90caf9); /* Light blue tones */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: auto; /* Allow scrolling if content is taller than viewport */
        }
        .payment-container {
            background-color: #ffffff;
            padding: 40px; /* Increased padding */
            border-radius: 16px; /* More rounded corners */
            /* Enhanced shadow and subtle border */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0; /* Light border */
            text-align: center;
            width: 100%;
            max-width: 550px; /* Slightly wider */
            animation: fadeInScale 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .icon-wrapper {
            margin-bottom: 1.5rem;
            animation: bounceIn 1s ease-out;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        .payment-icon {
            width: 80px; /* Larger icon */
            height: 80px;
            color: #4338ca; /* Primary color for icon */
        }

        h1 {
            color: #3730a3; /* Deeper indigo */
            font-size: 2.5rem; /* Larger heading */
            font-weight: 800; /* Bolder font */
            margin-bottom: 1rem;
            animation: fadeInUp 0.7s ease-out 0.2s backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        p {
            color: #4b5563; /* Medium gray */
            font-size: 1.125rem;
            margin-bottom: 2rem;
            line-height: 1.7;
            animation: fadeInUp 0.7s ease-out 0.3s backwards;
        }
        .profile-id-display {
            background-color: #e0f2fe; /* Light blue background */
            color: #1e3a8a; /* Darker blue text */
            padding: 10px 20px; /* More padding */
            border-radius: 10px; /* More rounded */
            font-family: 'Inter', sans-serif; /* Keep inter font */
            font-size: 0.95rem;
            font-weight: 600;
            display: inline-block;
            margin-top: 1.5rem;
            word-break: break-all;
            border: 1px solid #90cdf4; /* Subtle border */
            animation: fadeInUp 0.7s ease-out 0.4s backwards;
        }
        .btn-proceed {
            background-color: #22c55e; /* Green 500 */
            color: white;
            padding: 14px 30px; /* More padding */
            border-radius: 9999px; /* Fully rounded */
            font-weight: 700; /* Bolder */
            font-size: 1.25rem; /* Larger text */
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 15px rgba(34, 197, 94, 0.3); /* Stronger shadow */
            display: inline-block;
            margin-top: 2.5rem; /* More space */
            animation: fadeInUp 0.7s ease-out 0.5s backwards;
        }
        .btn-proceed:hover {
            background-color: #16a34a; /* Darker green */
            transform: translateY(-3px) scale(1.02); /* More pronounced lift and slight scale */
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4); /* Even stronger shadow */
        }
        .btn-proceed:active {
            transform: translateY(0px); /* Push down on click */
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.2);
        }
        .message-box {
            margin-top: 2rem; /* More space */
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            display: none;
            text-align: left; /* Align message text left */
            background-color: #fefcbf; /* Light yellow */
            color: #8c5a00; /* Dark yellow/brown */
            border: 1px solid #fbd38d; /* Yellow border */
            animation: fadeIn 0.5s ease-out;
        }

        /* Payment Success Overlay Styles */
        .payment-success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95); /* Semi-transparent white overlay */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 16px; /* Match container */
            z-index: 10; /* Above other content */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .payment-success-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .tick-icon {
            color: #22c55e; /* Green */
            width: 100px;
            height: 100px;
            animation: tickPop 0.6s ease-out;
            margin-bottom: 1rem;
        }

        @keyframes tickPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            80% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
            }
        }

        .success-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: #22c55e;
            margin-bottom: 0.5rem;
            animation: fadeInUp 0.7s ease-out 0.2s backwards;
        }

        .redirect-text {
            font-size: 1rem;
            color: #4b5563;
            animation: fadeInUp 0.7s ease-out 0.3s backwards;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="icon-wrapper">
            <!-- Payment Icon SVG -->
            <svg class="payment-icon mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
            </svg>
        </div>
        <h1>Proceed to Payment</h1>
        <p>Thank you for submitting your profile! A small payment is required to activate your service listing. Once payment is confirmed, your profile will be reviewed by our admin team.</p>
        
        <p class="text-sm text-gray-500">Your Profile ID: <span id="profileIdDisplay" class="profile-id-display">Loading...</span></p>

        <button id="proceedToGatewayBtn" class="btn-proceed">Go to Payment Gateway</button>
        
        <div id="messageBox" class="message-box"></div>

        <!-- Payment Success Overlay -->
        <div id="paymentSuccessOverlay" class="payment-success-overlay">
            <svg class="tick-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <div class="success-text">Payment Successful!</div>
            <div class="redirect-text">Redirecting you shortly...</div>
        </div>
    </div>

    <script type="module">
        // Function to display messages (similar to previous Canvases)
        function showMessage(message, type = 'info', duration = 3000) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.className = 'message-box'; // Reset classes for new styling
            if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-800', 'border-green-200');
            } else if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-800', 'border-red-200');
            } else { // info or default
                messageBox.classList.add('bg-yellow-100', 'text-yellow-800', 'border-yellow-200');
            }
            messageBox.style.display = 'block';
            if (duration > 0) {
                setTimeout(() => {
                    messageBox.style.display = 'none';
                }, duration);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const profileId = urlParams.get('profileId');
            const profileIdDisplay = document.getElementById('profileIdDisplay');
            const proceedToGatewayBtn = document.getElementById('proceedToGatewayBtn');
            const paymentSuccessOverlay = document.getElementById('paymentSuccessOverlay');

            if (profileId) {
                profileIdDisplay.textContent = profileId;
                showMessage(`Profile ID ${profileId} received.`, 'info', 0); // Display persistently
            } else {
                profileIdDisplay.textContent = 'N/A (No ID received)';
                showMessage('No profile ID found in URL. Please go through the profile creation process.', 'error', 0);
                proceedToGatewayBtn.disabled = true; // Disable button if no ID
            }

            proceedToGatewayBtn.addEventListener('click', () => {
                // Disable button to prevent multiple clicks
                proceedToGatewayBtn.disabled = true;
                showMessage("Simulating redirection to a payment gateway...", 'info', 5000);
                console.log("Proceeding to payment for Profile ID:", profileId);

                // Simulate payment gateway interaction and show success overlay
                setTimeout(() => {
                    paymentSuccessOverlay.classList.add('show'); // Show the success overlay
                    
                    // Simulate successful payment and redirect after a short delay
                    setTimeout(() => {
                        window.location.href = `payment-success.html?profileId=${profileId}`; // New page to indicate success
                    }, 2000); // Wait 2 seconds after showing overlay before redirect
                }, 3000); // Simulate 3 seconds for gateway interaction
            });
        });
    </script>
</body>
</html>
