<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="agentPageTitle">Become an Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* Base styles */
        :root {
            --base-font-size: 16px;
            --small-font-size: 14px;
            --medium-font-size: 16px;
            --large-font-size: 18px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #ffffff, #dbeafe);
            font-size: var(--base-font-size);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        body.font-small { font-size: var(--small-font-size); }
        body.font-medium { font-size: var(--medium-font-size); }
        body.font-large { font-size: var(--large-font-size); }

        /* Form-specific styles */
        .form-container {
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
            max-width: 800px;
            margin: 2rem auto;
            border: 1px solid #e0e0e0;
        }
        
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333; }
        .form-group label span { color: red; }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="file"],
        .form-group select {
            width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 0.5rem; font-size: 1rem;
            background-color: #f9f9f9; color: #333; transition: all 0.2s ease;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: #4b3cc4; box-shadow: 0 0 0 3px rgba(75, 60, 196, 0.2);
        }
        
        button[type="submit"] {
            width: 100%; background-color: #4b3cc4; color: white; padding: 1rem; border: none; border-radius: 0.75rem;
            font-size: 1.125rem; font-weight: 700; cursor: pointer; margin-top: 1.5rem; transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        button[type="submit"]:hover:not(:disabled) { background-color: #362ea4; transform: translateY(-2px); }
        button[type="submit"]:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        #messageBox {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.8);
            color: white; padding: 15px 25px; border-radius: 10px; z-index: 1000; display: none; text-align: center;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4b3cc4;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body class="min-h-screen font-sans">
    <header class="bg-gradient-to-r from-indigo-600 to-blue-700 text-white p-4 flex items-center justify-between shadow-lg">
         <h1 class="text-xl font-bold flex-grow text-center">Become an Agent</h1>
    </header>

    <main class="container mx-auto p-4 flex-grow">
        <div class="form-container">
            <h2 class="text-3xl font-bold text-center mb-8 text-gray-800" id="becomeAgentTitle">Become an Agent</h2>

            <form id="agentRegistrationForm">
                <div class="form-group">
                    <label for="firstName">First Name <span>*</span></label>
                    <input type="text" id="firstName" required placeholder="Enter your first name">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name <span>*</span></label>
                    <input type="text" id="lastName" required placeholder="Enter your last name">
                </div>
                <div class="form-group">
                    <label for="gender">Gender <span>*</span></label>
                    <select id="gender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="age">Age <span>*</span></label>
                    <input type="number" id="age" required min="18" placeholder="Enter your age (must be 18+)">
                </div>
                <div class="form-group">
                    <label for="profession">Profession <span>*</span></label>
                    <select id="profession" required>
                        <option value="">Select</option>
                        <option value="Student">Student</option>
                        <option value="Self Employed">Self Employed</option>
                        <option value="Business">Business</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number <span>*</span></label>
                    <input type="text" id="phone" pattern="[0-9]{10}" maxlength="10" required placeholder="Enter 10-digit phone number">
                </div>
                <div class="form-group">
                    <label for="whatsapp">WhatsApp Number <span>*</span></label>
                    <input type="text" id="whatsapp" pattern="[0-9]{10}" maxlength="10" required placeholder="Enter 10-digit WhatsApp number">
                </div>
                <div class="form-group">
                    <label for="email">Email <small>(optional)</small></label>
                    <input type="email" id="email" placeholder="Enter your email address (optional)">
                </div>
                <div class="form-group">
                    <label for="profilePhoto">Upload Photo <span>*</span></label>
                    <input type="file" id="profilePhoto" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label for="address">Address <span>*</span></label>
                    <input type="text" id="address" required placeholder="Enter your full address">
                </div>
                <div class="form-group">
                    <label for="aadhar">Aadhar Number <span>*</span></label>
                    <input type="text" id="aadhar" pattern="[0-9]{12}" maxlength="12" required placeholder="Enter 12-digit Aadhar number">
                </div>
                <div class="form-group">
                    <label for="bank">Bank Name <span>*</span></label>
                    <input type="text" id="bank" required placeholder="Enter your bank name">
                </div>
                <div class="form-group">
                    <label for="beneficiary">Beneficiary Name <span>*</span></label>
                    <input type="text" id="beneficiary" required placeholder="Enter beneficiary name (as per bank account)">
                </div>
                <div class="form-group">
                    <label for="account">Account Number <span>*</span></label>
                    <input type="text" id="account" required placeholder="Enter your bank account number">
                </div>
                <div class="form-group">
                    <label for="ifsc">IFSC Code <span>*</span></label>
                    <input type="text" id="ifsc" required placeholder="Enter your bank IFSC code">
                </div>

                <button type="submit" id="submitRequestButton">
                    Submit Request
                    <span id="submitSpinner" class="spinner hidden"></span>
                </button>
            </form>
        </div>
    </main>

    <!-- Message box to display user feedback -->
    <div id="messageBox" class="hidden"></div>

    <!-- Firebase SDK imports -->
    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js"></script>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);
        let currentUserId = null;

        const agentRegistrationForm = document.getElementById('agentRegistrationForm');
        const submitRequestButton = document.getElementById('submitRequestButton');
        const submitSpinner = document.getElementById('submitSpinner');
        const messageBox = document.getElementById('messageBox');

        onAuthStateChanged(auth, (user) => {
            currentUserId = user ? user.uid : null;
        });

        function showMessage(message, isError = false) {
            messageBox.textContent = message;
            messageBox.style.backgroundColor = isError ? 'rgba(239, 68, 68, 0.9)' : 'rgba(16, 185, 129, 0.9)';
            messageBox.classList.remove('hidden');
            setTimeout(() => messageBox.classList.add('hidden'), 4000);
        }

        agentRegistrationForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentUserId) {
                showMessage("You must be logged in to register as an agent. Please go to the Login/SignUp page.", true);
                return;
            }

            submitRequestButton.disabled = true;
            submitSpinner.classList.remove('hidden');

            const profilePhotoFile = document.getElementById('profilePhoto').files[0];
            if (!profilePhotoFile) {
                showMessage('Please upload a profile photo.', true);
                submitRequestButton.disabled = false;
                submitSpinner.classList.add('hidden');
                return;
            }

            try {
                // Upload photo to Firebase Storage
                const photoName = `${currentUserId}_${Date.now()}_${profilePhotoFile.name}`;
                const storageRef = ref(storage, `agent_photos/${currentUserId}/${photoName}`);
                await uploadBytes(storageRef, profilePhotoFile);
                const photoURL = await getDownloadURL(storageRef);

                const formData = {
                    firstName: document.getElementById('firstName').value.trim(),
                    lastName: document.getElementById('lastName').value.trim(),
                    gender: document.getElementById('gender').value,
                    age: parseInt(document.getElementById('age').value),
                    profession: document.getElementById('profession').value,
                    phoneNumber: document.getElementById('phone').value.trim(),
                    whatsappNumber: document.getElementById('whatsapp').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    profilePhotoUrl: photoURL,
                    address: document.getElementById('address').value.trim(),
                    aadhar: document.getElementById('aadhar').value.trim(),
                    bankName: document.getElementById('bank').value.trim(),
                    beneficiaryName: document.getElementById('beneficiary').value.trim(),
                    accountNumber: document.getElementById('account').value.trim(),
                    ifscCode: document.getElementById('ifsc').value.trim(),
                    status: 'pending',
                    submittedByUserId: currentUserId,
                    createdAt: serverTimestamp()
                };

                const docRef = await addDoc(collection(db, `artifacts/${appId}/public/data/agent_requests`), formData);
                
                showMessage('Agent registration submitted successfully! Your request is pending review.');
                agentRegistrationForm.reset();
                
            } catch (error) {
                console.error("Error submitting agent request:", error);
                showMessage(`Error: ${error.message}`, true);
            } finally {
                submitRequestButton.disabled = false;
                submitSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
