<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage - Find Services</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4ff; color: #1f2937; transition: background-color 0.3s, color 0.3s; }
        .service-category {
            background-color: white; text-align: center; padding: 2rem; border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
            border: 1px solid #e5e7eb;
        }
        .service-category:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1); }
        .service-category i { font-size: 2.25rem; margin-bottom: 0.75rem; color: #4f46e5; }
        .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; margin-right: 8px; }
        #messageBox { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background-color: rgba(17, 24, 39, 0.9); color: white; padding: 1rem 1.5rem; border-radius: 0.5rem; z-index: 1000; display: none; transition: opacity 0.3s; }
        .btn-toggle-active { background-color: #4f46e5; color: white; }
        .btn-toggle-inactive { background-color: white; color: #4f46e5; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Dark Mode */
        .dark { background-color: #111827; color: #d1d5db; }
        .dark .service-category { background-color: #1f2937; border-color: #374151; }
        .dark a.service-category span { color: #d1d5db; }
        .dark .service-category i { color: #818cf8; }
        .dark .search-container { background-color: #1f2937; }
        .dark .search-container input, .dark .search-container select { background-color: #374151; border-color: #4b5563; color: #d1d5db; }
        .dark .search-container input::placeholder { color: #9ca3af; }
        .dark header { background: rgba(31, 41, 55, 0.8); }
        .dark h1, .dark p { color: #f9fafb; }
    </style>
</head>
<body class="min-h-screen font-sans">
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <nav class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="Homepage.html" class="text-2xl font-bold text-indigo-600">GrowWork</a>
            <div class="flex items-center gap-2 sm:gap-4">
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-400">
                    <i class="fas fa-moon"></i>
                </button>
                <a id="myProfileLink" href="profile_page.html" class="hidden sm:inline px-4 py-2 text-sm font-semibold text-gray-700 hover:text-indigo-600 dark:text-gray-300 dark:hover:text-white">My Profile</a>
                <a id="beAnAgentLink" href="Agentform.html" class="hidden sm:inline px-4 py-2 text-sm font-semibold text-gray-700 hover:text-indigo-600 dark:text-gray-300 dark:hover:text-white">Be An Agent</a>
                <button id="loginSignupLink" class="px-3 sm:px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">Login/Up</button>
                <button id="logoutLink" class="px-3 sm:px-4 py-2 text-sm font-semibold text-white bg-red-600 rounded-lg hover:bg-red-700 hidden">Logout</button>
            </div>
        </nav>
    </header>

    <main class="container mx-auto p-4 mt-8">
        <h1 class="text-4xl font-extrabold text-center text-gray-800 mb-2">Find Local Services & Businesses</h1>
        <p class="text-center text-gray-500 mb-8">Your one-stop platform for all local needs.</p>
        
        <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-lg mb-12 search-container">
            <form id="search-form" class="space-y-4">
                 <div class="relative">
                    <input type="text" id="searchInput" name="q" placeholder="Search for Plumber, Electrician, Restaurant..." class="w-full p-4 pl-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" />
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <select id="selectState" name="state" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="" selected>Any State</option>
                    </select>
                    <select id="selectCity" name="city" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="" selected>Any City</option>
                    </select>
                     <button type="submit" class="w-full bg-indigo-600 text-white font-bold p-3 rounded-lg hover:bg-indigo-700 transition">
                        Search
                    </button>
                </div>
            </form>
        </div>
       
        <div class="flex justify-center mb-8">
            <div class="inline-flex rounded-lg shadow-sm">
                <button id="serviceToggle" class="px-6 py-2 text-sm font-medium border border-indigo-600 rounded-l-lg btn-toggle-active">Services</button>
                <button id="businessToggle" class="px-6 py-2 text-sm font-medium border-t border-b border-r border-indigo-600 rounded-r-lg btn-toggle-inactive hover:bg-gray-50">Businesses</button>
            </div>
        </div>

        <div id="dynamicCategoriesContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <p class="col-span-full text-center text-gray-500" id="categories-message"><span class="spinner"></span>Loading categories...</p>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 w-full bg-yellow-300 text-yellow-800 text-center py-3 font-bold text-sm shadow-inner z-40">
        📢 Promote your business here – <a href="anchor_ad_form.html" class="underline">Contact us!</a>
    </div>

    <div id="messageBox"></div>

    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, db, auth, userId;
        let allLocationsData = [], allCategoriesData = [];
        let isServiceMode = true;
        
        const serviceToggle = document.getElementById('serviceToggle');
        const businessToggle = document.getElementById('businessToggle');
        const searchForm = document.getElementById('search-form');
        const dynamicCategoriesContainer = document.getElementById('dynamicCategoriesContainer');
        const selectState = document.getElementById('selectState');
        const selectCity = document.getElementById('selectCity');
        const loginSignupLink = document.getElementById('loginSignupLink');
        const myProfileLink = document.getElementById('myProfileLink');
        const beAnAgentLink = document.getElementById('beAnAgentLink');
        const logoutLink = document.getElementById('logoutLink');
        const messageBox = document.getElementById('messageBox');
        
        function showMessage(message, isError = false) {
            messageBox.textContent = message;
            messageBox.style.backgroundColor = isError ? 'rgba(239, 68, 68, 0.9)' : 'rgba(16, 185, 129, 0.9)';
            messageBox.style.display = 'block';
            setTimeout(() => { messageBox.style.display = 'none'; }, 3000);
        }

        async function initializeFirebaseAndAuth() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                onAuthStateChanged(auth, updateUserUI);
            } catch (error) {
                console.error("Error initializing Firebase:", error);
                showMessage("Could not connect to services. Please try again later.", true);
            }
        }
        
        function updateUserUI(user) {
            loginSignupLink.onclick = () => window.location.href='login-signup-page.html';
            myProfileLink.style.display = 'none';
            beAnAgentLink.style.display = 'none';

            if (user) {
                userId = user.uid;
                loginSignupLink.classList.add('hidden');
                logoutLink.classList.remove('hidden');
                myProfileLink.href = `profile_page.html?id=${userId}`;
                beAnAgentLink.href = 'Agentform.html';
                myProfileLink.style.display = 'inline-block';
                beAnAgentLink.style.display = 'inline-block';
            } else {
                userId = null;
                loginSignupLink.classList.remove('hidden');
                logoutLink.classList.add('hidden');
                const loginRedirect = (e) => { 
                    e.preventDefault(); 
                    window.location.href='login-signup-page.html'; 
                };
                myProfileLink.onclick = loginRedirect;
                beAnAgentLink.onclick = loginRedirect;
            }
        }

        logoutLink.addEventListener('click', () => {
            signOut(auth).then(() => showMessage("Logged out successfully."));
        });
        
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(searchForm);
            const params = new URLSearchParams();
            for (const pair of formData.entries()) {
                if (pair[1]) { // only add non-empty values
                    params.append(pair[0], pair[1]);
                }
            }
            window.location.href = `search_results.html?${params.toString()}`;
        });
        
        async function fetchData(collectionName, orderByField = 'Name') {
            const path = `artifacts/${appId}/public/data/${collectionName}`;
            const q = query(collection(db, path), orderBy(orderByField));
            const querySnapshot = await getDocs(q);
            return querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }
        
        async function populateStates() {
            try {
                const locationsCollection = collection(db, `artifacts/${appId}/public/data/locations`);
                const q = query(locationsCollection, orderBy("State"), orderBy("City"));
                const locationsSnapshot = await getDocs(q);
                allLocationsData = locationsSnapshot.docs.map(doc => doc.data());

                const uniqueStates = [...new Set(allLocationsData.map(loc => loc.State))].sort();
                uniqueStates.forEach(state => selectState.innerHTML += `<option value="${state}">${state}</option>`);
            } catch (error) { console.error("Error populating states:", error); }
        }
        
        selectState.addEventListener('change', () => {
            const state = selectState.value;
            const uniqueCities = [...new Set(allLocationsData.filter(l => l.State === state).map(l => l.City))];
            selectCity.innerHTML = '<option value="" selected>Any City</option>';
            uniqueCities.forEach(city => selectCity.innerHTML += `<option value="${city}">${city}</option>`);
        });

        function renderCategories() {
            const typeFilter = isServiceMode ? 'Service' : 'Business';
            const filtered = allCategoriesData.filter(cat => cat.Type === typeFilter);
            
            dynamicCategoriesContainer.innerHTML = '';
            if (filtered.length > 0) {
                filtered.forEach(category => {
                    // This is the key change: we use `category.IconClass` directly from the database!
                    const iconClass = category.IconClass || 'fas fa-concierge-bell'; 
                    const categoryLink = document.createElement('a');
                    categoryLink.href = `search_results.html?category=${encodeURIComponent(category.Name)}`;
                    categoryLink.className = 'service-category';
                    categoryLink.innerHTML = `<i class="${iconClass}"></i><span class="font-semibold text-gray-800 dark:text-gray-200">${category.Name}</span>`;
                    dynamicCategoriesContainer.appendChild(categoryLink);
                });
            } else {
                 dynamicCategoriesContainer.innerHTML = `<p class="col-span-full text-center text-gray-500">No ${typeFilter.toLowerCase()} categories have been added yet.</p>`;
            }
        }
        
        async function loadInitialCategories() {
            try {
                allCategoriesData = await fetchData('categories', 'Name');
                renderCategories();
            } catch(e) {
                document.getElementById('categories-message').textContent = 'Error loading categories.';
                console.error("Error loading initial categories:", e);
            }
        }
        
        function toggleMode(newModeIsService) {
             if (isServiceMode !== newModeIsService) {
                isServiceMode = newModeIsService;
                serviceToggle.classList.toggle('btn-toggle-active', isServiceMode);
                serviceToggle.classList.toggle('btn-toggle-inactive', !isServiceMode);
                businessToggle.classList.toggle('btn-toggle-active', !isServiceMode);
                businessToggle.classList.toggle('btn-toggle-inactive', isServiceMode);
                renderCategories();
            }
        }
        
        serviceToggle.addEventListener('click', () => toggleMode(true));
        businessToggle.addEventListener('click', () => toggleMode(false));

        // Dark Mode Logic
        const themeToggle = document.getElementById('theme-toggle');
        const applyTheme = (theme) => {
            if (theme === 'dark') {
                document.body.classList.add('dark');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.body.classList.remove('dark');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }
        };
        themeToggle.addEventListener('click', () => {
            const newTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        });
        
        document.addEventListener('DOMContentLoaded', async () => {
            applyTheme(localStorage.getItem('theme'));
            await initializeFirebaseAndAuth();
            await populateStates();
            await loadInitialCategories();
        });
    </script>
</body>
</html>
