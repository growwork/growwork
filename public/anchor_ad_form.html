<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anchor Ad Form</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; }
    .container-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        padding: 1.5rem;
    }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-gradient-to-r from-indigo-600 to-blue-700 text-white p-4 w-full shadow-lg text-center">
    <h1 class="text-xl font-bold">Create Anchor Ad</h1>
  </header>

  <div class="container-wrapper">
      <div class="w-full max-w-2xl bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Your Anchor Ad Details</h2>
        <form id="adForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Name</label>
            <input type="text" id="nameInput" class="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., John Doe" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Photo/Logo</label>
            <input type="file" id="photoInput" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Phone</label>
            <input type="tel" id="phoneInput" class="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 9876543210" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Address</label>
            <input type="text" id="addressInput" class="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 123 Main Street, City" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Service Description</label>
            <textarea id="descriptionInput" class="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-indigo-500 focus:border-indigo-500" rows="3" placeholder="A short, catchy description of your service..." required></textarea>
          </div>
          <div class="pt-4 text-right">
            <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-sm">Submit Ad</button>
          </div>
        </form>
      </div>

      <!-- Anchor Ad Live Preview -->
      <div class="w-full max-w-2xl bg-gray-50 p-6 mt-8 rounded-xl shadow-lg">
        <h3 class="text-xl font-bold text-gray-800 mb-4">Live Anchor Ad Preview</h3>
        <div class="bg-white p-4 rounded-lg border border-gray-200 flex items-center space-x-4">
          <div>
            <img id="previewPhoto" src="https://via.placeholder.com/80" alt="Ad Photo" class="w-20 h-20 rounded-full object-cover border-2 border-indigo-200">
          </div>
          <div class="flex-1">
            <p class="text-lg font-bold text-gray-800" id="previewName">Your Name</p>
            <p class="text-sm text-gray-600 flex items-center"><i class="fas fa-phone-alt mr-2 text-indigo-400"></i><span id="previewPhone">Your Phone</span></p>
            <p class="text-sm text-gray-600 flex items-center"><i class="fas fa-map-marker-alt mr-2 text-indigo-400"></i><span id="previewAddress">Your Address</span></p>
            <p class="text-sm text-gray-600 italic mt-2" id="previewDescription">Your service description will appear here.</p>
          </div>
        </div>
      </div>
  </div>

  <script>
    const nameInput = document.getElementById('nameInput');
    const phoneInput = document.getElementById('phoneInput');
    const addressInput = document.getElementById('addressInput');
    const descriptionInput = document.getElementById('descriptionInput');
    const photoInput = document.getElementById('photoInput');
    const adForm = document.getElementById('adForm');

    const previewName = document.getElementById('previewName');
    const previewPhone = document.getElementById('previewPhone');
    const previewAddress = document.getElementById('previewAddress');
    const previewDescription = document.getElementById('previewDescription');
    const previewPhoto = document.getElementById('previewPhoto');

    const updatePreview = () => {
        previewName.textContent = nameInput.value || "Your Name";
        previewPhone.textContent = phoneInput.value || "Your Phone";
        previewAddress.textContent = addressInput.value || "Your Address";
        previewDescription.textContent = descriptionInput.value || "Your service description will appear here.";
    };
    
    nameInput.addEventListener('input', updatePreview);
    phoneInput.addEventListener('input', updatePreview);
    addressInput.addEventListener('input', updatePreview);
    descriptionInput.addEventListener('input', updatePreview);

    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => previewPhoto.src = e.target.result;
        reader.readAsDataURL(file);
      }
    });

    adForm.addEventListener('submit', (e) => {
        e.preventDefault();
        // In a real app, you would gather the data and send it to Firebase here.
        alert("Ad Submitted! (This is a demo)");
        console.log({
            name: nameInput.value,
            phone: phoneInput.value,
            address: addressInput.value,
            description: descriptionInput.value,
            photoFile: photoInput.files[0] ? photoInput.files[0].name : "No photo selected"
        });
        // Optionally, clear the form after submission
        // adForm.reset();
        // previewPhoto.src = "https://via.placeholder.com/80";
        // updatePreview();
    });
  </script>
</body>
</html>
