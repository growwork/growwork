<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            overflow-y: auto;
            max-height: 95vh;
        }

        h2 { color: #6a5acd; text-align: center; margin-bottom: 30px; font-size: 2.25rem; font-weight: 700; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 1rem; margin-bottom: 16px; transition: all 0.2s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6a5acd; box-shadow: 0 0 0 3px rgba(106, 92, 205, 0.2); }
        button {
            width: 100%; background-color: #6a5acd; color: white; border: none; padding: 14px; border-radius: 8px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 25px; transition: all 0.2s;
        }
        button:hover:not(:disabled) { background-color: #5947c0; transform: translateY(-2px); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        label span { color: red; margin-left: 4px; }
        .error-message { color: #ef4444; font-size: 0.875rem; margin-top: -12px; margin-bottom: 12px; display: none; }
        .error-message.visible { display: block; }
        #messageBox {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8); color: white; padding: 10px 20px;
            border-radius: 8px; z-index: 1000; display: none; text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Complete Your Profile</h2>

        <form id="profileForm">
            <!-- Form fields are the same as your original, but no password fields -->
            <label for="formType">Form is Self or By Agent <span>*</span></label>
            <select id="formType" onchange="toggleAgentIdField()" class="mb-4">
                <option value="self" selected>Self</option>
                <option value="agent">By Agent</option>
            </select>
            <div id="agentIdField" style="display: none;">
                <label for="agentId">Enter Agent ID <span>*</span></label>
                <input type="text" id="agentId" placeholder="Agent ID">
            </div>

            <label for="userType">Register as <span>*</span></label>
            <select id="userType" onchange="updateFormFields()" class="mb-4">
                <option value="">Select</option>
                <option value="service">Service</option>
                <option value="business">Business</option>
            </select>
            <div id="userType-error" class="error-message"></div>
            
            <label for="firstName">First Name <span>*</span></label>
            <input type="text" id="firstName" required>
            <div id="firstName-error" class="error-message"></div>
            
            <label for="lastName">Last Name <span>*</span></label>
            <input type="text" id="lastName" required>
            <div id="lastName-error" class="error-message"></div>
            
            <label id="nameLabel">Service/Business Name <span>*</span></label>
            <input type="text" id="serviceBusinessName" required>
            <div id="serviceBusinessName-error" class="error-message"></div>

            <label id="categoryLabel">Category / Service 1 <span>*</span></label>
            <input type="text" id="service1" required>
            <div id="service1-error" class="error-message"></div>

            <label>Category / Service 2 (optional)</label>
            <input type="text" id="service2">

            <label for="state">State <span>*</span></label>
            <select id="state" onchange="populateCities()" class="mb-4" required>
                <option value="">Select State</option>
            </select>
            <div id="state-error" class="error-message"></div>

            <label for="city">City <span>*</span></label>
            <select id="city" class="mb-4" required>
                <option value="">Select City</option>
            </select>
            <div id="city-error" class="error-message"></div>
            
            <label for="fullAddress">Full Address <span>*</span></label>
            <textarea id="fullAddress" placeholder="e.g., Mudiyan Wali Gali, Shivpuri Taal, Jhansi" rows="3" required></textarea>
            <div id="fullAddress-error" class="error-message"></div>
            
            <label for="serviceBusinessMobileNumber">Service/Business Mobile <span>*</span></label>
            <input type="tel" id="serviceBusinessMobileNumber" required>
            <div id="serviceBusinessMobileNumber-error" class="error-message"></div>

            <label for="openTime">Open Time <span>*</span></label>
            <input type="time" id="openTime" required>
            <div id="openTime-error" class="error-message"></div>

            <label for="closeTime">Close Time <span>*</span></label>
            <input type="time" id="closeTime" required>
            <div id="closeTime-error" class="error-message"></div>
            
            <label>Description <span>*</span></label>
            <textarea id="description" rows="4" placeholder="Provide a brief description of your service/business..." required></textarea>
            <div id="description-error" class="error-message"></div>
            
            <label for="uploadFile">Upload Photo/Logo <span>*</span></label>
            <input type="file" id="uploadFile" accept="image/*" required>
            <div id="uploadFile-error" class="error-message"></div>

            <label style="display: flex; align-items: center; margin-top: 20px;">
                <input type="checkbox" id="termsCheckbox" required style="width: auto; margin-right: 8px;"> I agree to the <a href="#" target="_blank" style="color: #6a5acd; text-decoration: underline; margin-left: 4px;">terms and policy</a>.
            </label>
            <div id="termsCheckbox-error" class="error-message"></div>
            
            <button type="submit" id="submitProfileBtn">Submit & Proceed to Payment</button>
        </form>
    </div>
    
    <div id="messageBox"></div>

    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        let app, auth, db, storage;
        let authUserId = null; // Renamed from userId to avoid confusion with profile ID from URL
        let profileUserId = null;
        let allLocationsData = [];

        // DOM elements
        const profileForm = document.getElementById('profileForm');
        const submitProfileBtn = document.getElementById('submitProfileBtn');
        const userTypeSelect = document.getElementById('userType');
        const messageBox = document.getElementById('messageBox');

        function showMessage(message, isError = false) {
            messageBox.textContent = message;
            messageBox.style.backgroundColor = isError ? 'rgba(239, 68, 68, 0.9)' : 'rgba(16, 185, 129, 0.9)';
            messageBox.classList.remove('hidden');
            setTimeout(() => messageBox.classList.add('hidden'), 5000);
        }

        async function initializeFirebaseAndAuth() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                storage = getStorage(app);
            
                const urlParams = new URLSearchParams(window.location.search);
                profileUserId = urlParams.get('userId');
                if (!profileUserId) {
                    showMessage("Invalid access. No user ID provided. Redirecting...", true);
                    setTimeout(() => window.location.href = 'login-signup-page.html', 3000);
                    return;
                }

                onAuthStateChanged(auth, (user) => {
                    if (user && user.uid === profileUserId) {
                        authUserId = user.uid;
                        console.log("Authenticated user matches profile ID:", authUserId);
                    } else {
                        showMessage("Authentication error or session mismatch. Please log in.", true);
                        setTimeout(() => window.location.href = 'login-signup-page.html', 3000);
                    }
                });
            } catch (e) {
                console.error("Firebase init failed:", e);
                showMessage("Service connection failed.", true);
            }
        }

        function toggleAgentIdField() { /* ... unchanged ... */ }
        function updateFormFields() { /* ... unchanged ... */ }

        async function populateStates() {
            const stateSelect = document.getElementById('state');
            stateSelect.innerHTML = `<option value="">Loading States...</option>`;
            try {
                const querySnapshot = await getDocs(collection(db, `artifacts/${appId}/public/data/locations`));
                allLocationsData = querySnapshot.docs.map(doc => doc.data());
                const uniqueStates = [...new Set(allLocationsData.map(loc => loc.State))].sort();
                stateSelect.innerHTML = `<option value="">Select State</option>`;
                uniqueStates.forEach(state => {
                    const option = document.createElement('option');
                    option.value = state;
                    option.textContent = state;
                    stateSelect.appendChild(option);
                });
            } catch (error) {
                console.error("Error populating states:", error);
                stateSelect.innerHTML = `<option value="">Error loading states</option>`;
            }
        }
        window.populateCities = function() {
             const state = document.getElementById('state').value;
             const citySelect = document.getElementById('city');
             citySelect.innerHTML = '<option value="">Select City</option>';
             if (state) {
                 const cities = [...new Set(allLocationsData.filter(loc => loc.State === state).map(loc => loc.City))].sort();
                 cities.forEach(city => {
                     citySelect.innerHTML += `<option value="${city}">${city}</option>`;
                 });
             }
        }
        
        // Validation helpers...
        function clearErrors() { /* ... */ }
        function validateField(inputElement, errorElement, message) { /* ... */ }

        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!authUserId) {
                showMessage("You are not properly authenticated. Please re-login.", true);
                return;
            }

            submitProfileBtn.disabled = true;
            submitProfileBtn.textContent = 'Submitting...';

            const file = document.getElementById('uploadFile').files[0];
            if (!file) {
                showMessage("Please upload a photo or logo.", true);
                submitProfileBtn.disabled = false;
                submitProfileBtn.textContent = 'Submit & Proceed to Payment';
                return;
            }

            const profileData = {
                type: userTypeSelect.value,
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                name: document.getElementById('serviceBusinessName').value.trim(),
                service1: document.getElementById('service1').value.trim(),
                service2: document.getElementById('service2').value.trim() || null,
                state: document.getElementById('state').value,
                city: document.getElementById('city').value,
                fullAddress: document.getElementById('fullAddress').value.trim(),
                serviceBusinessMobileNumber: document.getElementById('serviceBusinessMobileNumber').value.trim(),
                openTime: document.getElementById('openTime').value,
                closeTime: document.getElementById('closeTime').value,
                description: document.getElementById('description').value.trim(),
                status: 'pending',
                createdAt: new Date().toISOString(),
            };

            // Basic validation check...
            if (!profileData.type || !profileData.firstName || !profileData.name) {
                showMessage("Please fill all required fields.", true);
                submitProfileBtn.disabled = false;
                submitProfileBtn.textContent = 'Submit & Proceed to Payment';
                return;
            }

            try {
                // Upload image
                const storageRef = ref(storage, `profile_pictures/${authUserId}/${file.name}`);
                await uploadBytes(storageRef, file);
                const photoURL = await getDownloadURL(storageRef);
                profileData.profilePictureUrl = photoURL;
                
                // Get authenticated user info for linking
                const user = auth.currentUser;
                profileData.email = user.email; // Save user's main email
                profileData.primaryPhoneNumber = user.phoneNumber; // If phone auth was used

                // Save profile data to Firestore under the user's UID
                const docRef = doc(db, `artifacts/${appId}/public/data/service_providers`, authUserId);
                await setDoc(docRef, profileData, { merge: true });

                showMessage("Profile saved! Redirecting to payment...", false);
                setTimeout(() => {
                    window.location.href = `payment.html?userId=${authUserId}`;
                }, 2000);
            } catch (error) {
                console.error("Error submitting profile:", error);
                showMessage(`Submission failed: ${error.message}`, true);
                submitProfileBtn.disabled = false;
                submitProfileBtn.textContent = 'Submit & Proceed to Payment';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            initializeFirebaseAndAuth();
            populateStates();
        });
    </script>
</body>

</html>
