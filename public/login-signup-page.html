<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GrowWork - Login & Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f0f4ff; } 
        .container-fade { animation: fadeIn 0.5s ease-out; } 
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } } 
        button:disabled { cursor: not-allowed; opacity: 0.7; }
        .spinner {
            border: 2px solid #f3f3f3; border-top: 2px solid #fff; border-radius: 50%;
            width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<div class="container-fade bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Welcome!</h2>
    <p class="text-center text-gray-500 mb-6" id="auth-prompt-text">Log in or create an account to continue.</p>

    <!-- Email and Password Form -->
    <div class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="user@example.com">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="••••••••">
        </div>
    </div>
    
    <div id="message-box" class="mt-4 text-center text-sm font-medium text-red-600 h-5"></div>

    <div class="flex gap-4 mt-6">
        <button id="login-btn" class="w-full bg-indigo-600 text-white py-2.5 px-4 rounded-lg font-semibold hover:bg-indigo-700 transition flex items-center justify-center">Log In</button>
        <button id="signup-btn" class="w-full bg-indigo-100 text-indigo-700 py-2.5 px-4 rounded-lg font-semibold hover:bg-indigo-200 transition flex items-center justify-center">Sign Up</button>
    </div>

    <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-gray-300"></span></div>
        <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-gray-500">Or continue with</span></div>
    </div>

    <!-- Social Login -->
    <div class="flex justify-center">
        <button id="google-btn" class="w-full flex justify-center items-center gap-2 border border-gray-300 rounded-lg py-2.5 hover:bg-gray-50 transition">
            <svg class="w-5 h-5" viewBox="0 0 48 48" aria-hidden="true"><g><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path><path fill="none" d="M0 0h48v48H0z"></path></g></svg>
            Google
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, getAdditionalUserInfo, onAuthStateChanged, sendEmailVerification } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyD4e8QdrgT4p0Qlq4yKmMz8iUtd6ZqGFgg",
        authDomain: "growwork-8e32e.firebaseapp.com",
        projectId: "growwork-8e32e",
        storageBucket: "growwork-8e32e.appspot.com",
        messagingSenderId: "74310023008",
        appId: "1:74310023008:web:91f90c971fd8ba0a851005"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const adminEmail = "deepak.loomsberries@gmail.com";

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const signupBtn = document.getElementById('signup-btn');
    const googleBtn = document.getElementById('google-btn');
    const messageBox = document.getElementById('message-box');
    const promptText = document.getElementById('auth-prompt-text');

    const ALL_BUTTONS = [loginBtn, signupBtn, googleBtn];
    const ORIGINAL_TEXT = { 'login-btn': 'Log In', 'signup-btn': 'Sign Up', 'google-btn': googleBtn.innerHTML };

    function showMessage(text, isError = false) { 
        messageBox.textContent = text; 
        messageBox.style.color = isError ? 'rgb(220 38 38)' : 'rgb(22 163 74)';
    }
    
    function setButtonsLoading(isLoading, clickedButton = null) {
        ALL_BUTTONS.forEach(btn => {
            btn.disabled = isLoading;
            const originalContent = ORIGINAL_TEXT[btn.id];
            if (isLoading && btn === clickedButton) {
                btn.innerHTML = `<span class="spinner"></span>` + originalContent;
            } else if (!isLoading) {
                 btn.innerHTML = originalContent;
            }
        });
    }

    // REDIRECT LOGIC FOR ALREADY LOGGED-IN USERS
    onAuthStateChanged(auth, (user) => {
        if (user) { 
            promptText.textContent = "Already logged in. Redirecting...";
            setButtonsLoading(true);
            handleLoginSuccess({ user }); // Pass the user object for checking
        }
    });

    function handleLoginSuccess(userCredential, isNewUser = false) {
        const user = userCredential.user;
        // ADMIN REDIRECT
        if (user.email === adminEmail) {
            showMessage('Admin login successful! Redirecting...', false);
            setTimeout(() => window.location.href = `admin.html`, 1500);
            return;
        }

        // REGULAR USER REDIRECT
        if (isNewUser) {
            showMessage('Signup successful! Taking you to the next step...', false);
            setTimeout(() => window.location.href = `form_with_payment.html?userId=${user.uid}`, 2000);
        } else {
            showMessage('Login Successful! Redirecting...', false);
            setTimeout(() => window.location.href = 'Homepage.html', 1500);
        }
    }

    loginBtn.addEventListener('click', () => {
        showMessage("");
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) return showMessage('Please enter both email and password.', true);
        
        setButtonsLoading(true, loginBtn);
        signInWithEmailAndPassword(auth, email, password)
            .then(userCredential => handleLoginSuccess(userCredential, false))
            .catch(error => {
                 showMessage("Incorrect email or password.", true);
                 setButtonsLoading(false);
            });
    });

    signupBtn.addEventListener('click', () => {
        showMessage("");
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || password.length < 6) return showMessage('Enter valid email & password (min 6 chars).', true);
        
        setButtonsLoading(true, signupBtn);
        createUserWithEmailAndPassword(auth, email, password)
            .then(async (userCredential) => {
                 await sendEmailVerification(auth.currentUser);
                 handleLoginSuccess(userCredential, true);
            })
            .catch(error => {
                let msg = "Signup failed.";
                if (error.code === 'auth/email-already-in-use') msg = "This email is already registered.";
                else if (error.code === 'auth/weak-password') msg = "Password is too weak (min 6 chars).";
                showMessage(msg, true);
                setButtonsLoading(false);
            });
    });

    googleBtn.addEventListener('click', () => {
        showMessage("");
        const provider = new GoogleAuthProvider();
        setButtonsLoading(true, googleBtn);
        signInWithPopup(auth, provider)
            .then(result => {
                const isNewUser = getAdditionalUserInfo(result).isNewUser;
                handleLoginSuccess(result, isNewUser);
            })
            .catch(error => {
                let msg = `Google sign-in failed. Please try again.`;
                if (error.code === 'auth/popup-closed-by-user') msg = "Sign-in cancelled.";
                showMessage(msg, true);
                setButtonsLoading(false);
            });
    });
</script>
</body>
</html>
