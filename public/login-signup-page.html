<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GrowWork - Login & Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; background-color: #f0f4ff; } .container-fade { animation: fadeIn 0.5s ease-out; } @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } } </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<div class="container-fade bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Welcome Back!</h2>
    <p class="text-center text-gray-500 mb-6">Log in or create an account to continue.</p>

    <!-- Email and Password Form -->
    <div class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
        </div>
    </div>
    
    <div id="message-box" class="mt-4 text-center text-sm font-medium text-red-600 h-4"></div>

    <div class="flex gap-4 mt-6">
        <button id="login-btn" class="w-full bg-indigo-600 text-white py-2.5 px-4 rounded-lg font-semibold hover:bg-indigo-700 transition">Log In</button>
        <button id="signup-btn" class="w-full bg-indigo-100 text-indigo-700 py-2.5 px-4 rounded-lg font-semibold hover:bg-indigo-200 transition">Sign Up</button>
    </div>

    <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-gray-300"></span></div>
        <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-gray-500">Or continue with</span></div>
    </div>

    <!-- Social and Anonymous Login -->
    <div class="grid grid-cols-2 gap-4">
        <button id="google-btn" class="w-full flex justify-center items-center gap-2 border border-gray-300 rounded-lg py-2.5 hover:bg-gray-50 transition">
            <svg class="w-5 h-5" viewBox="0 0 48 48"><g><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path><path fill="none" d="M0 0h48v48H0z"></path></g></svg>
            Google
        </button>
        <button id="anon-btn" class="w-full flex justify-center items-center gap-2 border border-gray-300 rounded-lg py-2.5 hover:bg-gray-50 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            Guest
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    // Your backend server will inject the real config here. This is a fallback.
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const signupBtn = document.getElementById('signup-btn');
    const googleBtn = document.getElementById('google-btn');
    const anonBtn = document.getElementById('anon-btn');
    const messageBox = document.getElementById('message-box');

    function showMessage(text, isError = false) { messageBox.textContent = text; messageBox.style.color = isError ? 'rgb(220 38 38)' : 'rgb(22 163 74)'; }
    
    // REDIRECTION LOGIC
    async function handleLoginSuccess(user) {
        showMessage('Login Successful! Checking your profile...', false);
        const userDocRef = doc(db, `artifacts/${appId}/public/data/service_providers`, user.uid);
        try {
            const docSnap = await getDoc(userDocRef);
            if (docSnap.exists()) {
                window.location.href = '/User_profile_page.html'; // Existing user
            } else {
                window.location.href = `/form_with_payment.html?userId=${user.uid}`; // New user
            }
        } catch (error) {
            console.error("Error checking for profile, redirecting to form.", error);
            window.location.href = `/form_with_payment.html?userId=${user.uid}`;
        }
    }

    // Email/Password Login
    loginBtn.addEventListener('click', () => {
        signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
            .then(userCredential => handleLoginSuccess(userCredential.user))
            .catch(error => showMessage(error.message, true));
    });

    // Email/Password Signup
    signupBtn.addEventListener('click', () => {
        createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
            .then(userCredential => handleLoginSuccess(userCredential.user))
            .catch(error => showMessage(error.message, true));
    });

    // Google Sign-in
    googleBtn.addEventListener('click', () => {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider)
            .then(result => handleLoginSuccess(result.user))
            .catch(error => showMessage(error.message, true));
    });

    // Anonymous Sign-in
    anonBtn.addEventListener('click', () => {
        signInAnonymously(auth)
            .then(result => handleLoginSuccess(result.user))
            .catch(error => showMessage(error.message, true));
    });
</script>
</body>
</html>
