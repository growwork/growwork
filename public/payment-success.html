<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #dcfce7, #a7f3d0); }
        .success-container { animation: popIn 0.6s ease-out; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="success-container bg-white p-10 rounded-2xl shadow-xl text-center max-w-lg">
        <svg class="w-20 h-20 text-green-500 mx-auto mb-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <h1 class="text-3xl font-extrabold text-gray-800 mb-3">Payment Successful!</h1>
        <p class="text-gray-600 mb-6">Your profile is now submitted for admin review. You will be notified once it is approved.</p>
        <p class="text-sm text-gray-500 mb-6">Your Profile ID is: <strong id="profileIdDisplay"></strong></p>
        <a href="/User_profile_page.html" class="inline-block bg-green-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-green-700 transition">Go to My Profile</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const profileId = urlParams.get('userId'); // Matches the param from form_with_payment.html
            if (profileId) {
                document.getElementById('profileIdDisplay').textContent = profileId;
            } else {
                document.getElementById('profileIdDisplay').textContent = 'Not found';
            }
        });
    </script>
</body>
</html>
