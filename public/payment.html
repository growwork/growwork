<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proceed to Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #e0f7fa, #bbdefb, #90caf9); }
        .payment-container { animation: fadeInScale 0.8s ease-out; }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .spinner { border: 4px solid rgba(0,0,0,0.1); border-top: 4px solid white; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin-right: 0.75rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="payment-container bg-white p-10 rounded-xl shadow-2xl text-center w-full max-w-md">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Final Step: Payment</h1>
        <p class="text-gray-600 mb-8">A one-time fee is required to list your profile. This helps us maintain the platform and verify providers.</p>
        
        <div class="bg-indigo-50 p-6 rounded-lg mb-8">
            <div class="text-4xl font-extrabold text-indigo-600">₹199</div>
            <div class="text-sm text-indigo-500">One-Time Listing Fee</div>
        </div>

        <button id="proceedToGatewayBtn" class="w-full flex items-center justify-center bg-green-500 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-600 transition shadow-lg">
            <span id="buttonSpinner" class="spinner hidden"></span>
            <span id="buttonText">Pay with UPI / Card</span>
        </button>
        
        <div id="messageBox" class="mt-4 text-sm text-red-600"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId');
            const proceedBtn = document.getElementById('proceedToGatewayBtn');
            const btnText = document.getElementById('buttonText');
            const btnSpinner = document.getElementById('buttonSpinner');
            const messageBox = document.getElementById('messageBox');

            if (!userId) {
                messageBox.textContent = 'Error: No user ID found. Cannot proceed.';
                proceedBtn.disabled = true;
                return;
            }

            proceedBtn.addEventListener('click', () => {
                proceedBtn.disabled = true;
                btnText.textContent = 'Processing...';
                btnSpinner.classList.remove('hidden');
                
                // Simulate a payment gateway process
                setTimeout(() => {
                    // On "success", redirect to the success page, passing the userId
                    window.location.href = `payment-success.html?userId=${userId}`;
                }, 2500); // 2.5 second delay to simulate payment
            });
        });
    </script>
</body>
</html>
